<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
    <defs>
        <!-- Метален златен градиент, съвпадащ с оригиналния стил -->
        <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FCE193"/>
            <stop offset="50%" stop-color="#E5B95D"/>
            <stop offset="100%" stop-color="#AD7B23"/>
        </linearGradient>
    </defs>

    <!-- Тъмен фон -->
    <rect width="100%" height="100%" fill="#0B0C10" rx="24"/>

    <!-- Ограждащ елемент (заоблен квадрат) - уголемен и центриран -->
    <rect x="18" y="18" width="204" height="204" rx="36" fill="none" stroke="url(#gold)" stroke-width="10"/>

    <!-- Дръжка на куфарчето (отгоре) -->
    <path d="M 82 75 V 56 C 82 42 92 38 108 38 H 132 C 148 38 158 42 158 56 V 75" 
          fill="none" stroke="url(#gold)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Тяло на куфарчето - уголемено и центрирано -->
    <rect x="48" y="75" width="144" height="115" rx="20" fill="none" stroke="url(#gold)" stroke-width="10"/>

    <!-- Ключалка (кръгче и малко правоъгълниче отдолу) -->
    <circle cx="120" cy="132" r="17" fill="none" stroke="url(#gold)" stroke-width="8"/>
    
</svg>